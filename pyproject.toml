[project]
name = "enterprise-support-agent"
version = "0.2.0"
description = "Enterprise technical support and incident diagnosis RAG platform"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["rag", "langgraph", "fastapi", "enterprise-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "chromadb>=1.0.12",
    "cohere>=5.20.7",
    "fastapi>=0.135.1",
    "jinja2>=3.1.6",
    "langchain>=1.2.13",
    "langchain-cohere>=0.5.0",
    "openai>=2.29.0",
    "pandas>=3.0.1",
    "pdfplumber>=0.11.9",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.13.1",
    "rapidfuzz>=3.14.3",
    "uvicorn[standard]>=0.42.0",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "fastapi-users[sqlalchemy]>=15.0.4",
    "PyJWT>=2.13.0",
    "pygments>=2.20.0",
    "aiosqlite>=0.21.0",
    "pgvector>=0.3.6",
    "arq>=0.26.3",
]

[project.optional-dependencies]
local-ml = [
    "langchain-huggingface>=1.2.1",
    "sentence-transformers>=5.3.0",
]

[dependency-groups]
dev = [
    "mypy>=1.16.0",
    "pytest>=9.0.2",
    "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
ignore_missing_imports = true
